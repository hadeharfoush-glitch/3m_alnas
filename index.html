<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>HADI SYSTEM v13</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
    --gold:#D4AF37;
    --bg:#000;
    --glass:rgba(255,255,255,0.04);
    --soft:rgba(212,175,55,0.18);
}

/* iOS REAL FEEL FONT */
body{
    margin:0;
    background:var(--bg);
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
}

/* layout */
.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}

/* glass premium */
.card{
    background:var(--glass);
    border:1px solid var(--soft);
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    backdrop-filter: blur(25px);
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

/* clock */
.clock{
    font-size:52px;
    text-align:center;
    color:var(--gold);
    font-weight:200;
    margin:20px 0;
    letter-spacing:-1px;
}

/* days */
.days{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.day{
    text-align:center;
    font-size:10px;
    opacity:0.7;
}

.circle{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:5px;
    transition:0.2s;
}

.active .circle{
    border-color:var(--gold);
    background:rgba(212,175,55,0.12);
    box-shadow:0 0 15px rgba(212,175,55,0.2);
}

/* task */
.task{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);
    transition:0.2s;
    cursor:pointer;
}

.task:active{
    transform:scale(0.98);
}

.check{
    width:18px;
    height:18px;
    border:1px solid var(--gold);
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* period */
.period{
    font-size:10px;
    color:var(--gold);
    opacity:0.7;
    letter-spacing:2px;
    margin-bottom:10px;
}

/* small glow */
.glow{
    color:var(--gold);
    text-align:center;
    font-size:13px;
    opacity:0.8;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useMemo} = React;

/* 🔊 premium click sound */
const clickSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-click-melodic-tone-1129.mp3");
clickSound.volume = 0.4;

/* schedule */
const SCHEDULE = {
  "الصباح":[
    {id:"m1",text:"استيقاظ + ترتيب اليوم"},
    {id:"m2",text:"تمارين جسم"},
    {id:"m3",text:"قراءة / تطوير"}
  ],
  "التركيز":[
    {id:"p1",text:"دراسة"},
    {id:"p2",text:"إنجليزي"},
    {id:"p3",text:"كوبي رايتينغ"}
  ],
  "المساء":[
    {id:"e1",text:"نادي / رياضة"},
    {id:"e2",text:"شغل Upwork"},
    {id:"e3",text:"تخطيط بكرا"}
  ]
};

function App(){

const [time,setTime]=useState(new Date());
const [done,setDone]=useState(()=>{
    return JSON.parse(localStorage.getItem("done")||"{}");
});

useEffect(()=>{
    const t=setInterval(()=>setTime(new Date()),1000);
    return ()=>clearInterval(t);
},[]);

useEffect(()=>{
    localStorage.setItem("done",JSON.stringify(done));
},[done]);

const toggle=(id)=>{
    clickSound.play().catch(()=>{});
    setDone(prev=>({...prev,[id]:!prev[id]}));
};

const progress=useMemo(()=>{
    const all=Object.values(SCHEDULE).flat().length;
    const ok=Object.values(done).filter(Boolean).length;
    return Math.round((ok/all)*100);
},[done]);

const days=["أحد","إثن","ثلاث","أربع","خميس","جمعة","سبت"];

return(
<div className="container">

{/* days */}
<div className="days">
{days.map((d,i)=>(
<div key={i} className={`day ${time.getDay()===i?'active':''}`}>
{time.getDay()===i && <div style={{color:"#D4AF37"}}>{progress}%</div>}
<div className="circle">{d}</div>
</div>
))}
</div>

{/* clock */}
<div className="clock">
{time.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
</div>

<div className="glow">SYSTEM ACTIVE • LEVEL LIFE</div>

{/* progress */}
<div className="card">
التقدم اليوم: {progress}%
</div>

{/* tasks */}
{Object.entries(SCHEDULE).map(([p,tasks])=>(
<div className="card" key={p}>
<div className="period">{p}</div>

{tasks.map(t=>(
<div className="task"
key={t.id}
onClick={()=>toggle(t.id)}
style={{opacity:done[t.id]?0.4:1}}>

<div className="check">
{done[t.id] && "✓"}
</div>

<div style={{flex:1,marginRight:10}}>
{t.text}
</div>

</div>
))}

</div>
))}

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
