<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadi | Mastermind System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg: #000;
            --glass: rgba(255, 255, 255, 0.03);
        }
        body {
            margin: 0; background: var(--bg); color: #fff;
            font-family: 'Alexandria', sans-serif; -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(circle at 50% 0%, #1a1608 0%, #000 80%);
        }
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 25px;
            padding: 20px; margin-bottom: 20px;
        }
        .priority-card {
            border: 1px solid var(--gold); box-shadow: 0 0 20px var(--gold-glow);
            background: linear-gradient(135deg, rgba(212,175,55,0.05) 0%, rgba(0,0,0,0) 100%);
        }
        .eng-clock { font-family: 'Playfair Display', serif; font-size: 55px; color: var(--gold); text-align: center; margin: 20px 0; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--gold); box-shadow: 0 0 10px var(--gold); transition: 1s; }
        .btn-check { width: 22px; height: 22px; border: 1px solid var(--gold); border-radius: 5px; cursor: pointer; }
        .insight-box { border-right: 3px solid var(--gold); padding-right: 15px; font-style: italic; color: #ccc; font-size: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const INSIGHTS = [
            "Copywriting Tip: العناوين هي 80% من نجاح المحتوى. ابدأ بفائدة قوية.",
            "English Word: 'Resilience' تعني القدرة على التعافي بسرعة من الصعوبات.",
            "Copywriting Tip: ركز على 'الفوائد' وليس فقط 'المميزات'.",
            "English Word: 'Ambition' تعني الطموح، وهو وقود النجاح المستدام.",
            "Copywriting Tip: استخدم أسلوب القصة (Storytelling) لجذب القارئ عاطفياً.",
            "Smart Learning: أفضل طريقة للحفظ هي تعليم المعلومة لشخص آخر.",
            "FC Mobile Tip: التوازن بين الدفاع والهجوم أهم من الـ OVR العالي وحده."
        ];

        function App() {
            const [time, setTime] = useState(new Date());
            const [score, setScore] = useState(0);
            const [day90, setDay90] = useState(42); // مثال: اليوم الـ 42

            useEffect(() => {
                const interval = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(interval);
            }, []);

            const dailyInsight = INSIGHTS[time.getDate() % INSIGHTS.length];

            return (
                <div style={{ padding: '40px 20px', maxWidth: '480px', margin: '0 auto' }}>
                    
                    {/* English Clock */}
                    <div className="eng-clock">
                        {time.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' })}
                    </div>

                    {/* Elite Insight - معلومة اليوم المتغيرة */}
                    <div className="glass-panel" style={{background: 'rgba(212,175,55,0.02)'}}>
                        <div style={{fontSize: '10px', color: var(--gold), marginBottom: '8px', letterSpacing: '1px'}}>DAILY INSIGHT</div>
                        <div className="insight-box">{dailyInsight}</div>
                    </div>

                    {/* Priority Habit - أهم عادة */}
                    <div className="glass-panel priority-card">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                            <div>
                                <div style={{fontSize: '11px', color: var(--gold)}}>الأولوية القصوى اليوم</div>
                                <div style={{fontSize: '17px', fontWeight: 'bold', marginTop: '5px'}}>إتقان ركيزة المحتوى التعليمي ✍️</div>
                            </div>
                            <div className="btn-check" style={{background: score > 0 ? var(--gold) : 'transparent'}}></div>
                        </div>
                    </div>

                    {/* 90-Day Tracker */}
                    <div className="glass-panel">
                        <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '12px'}}>
                            <span>تحدي الـ 90 يوماً</span>
                            <span style={{color: var(--gold)}}>Day {day90}/90</span>
                        </div>
                        <div className="progress-bar">
                            <div className="progress-fill" style={{width: `${(day90/90)*100}%`}}></div>
                        </div>
                    </div>

                    {/* Habits Section */}
                    <div style={{marginTop: '30px'}}>
                        <h3 style={{fontSize: '14px', color: '#666', marginBottom: '15px'}}>الروتين الاستراتيجي</h3>
                        <div className="glass-panel" style={{padding: '5px 15px'}}>
                            {[
                                {t: 'قراءة 20 صفحة (النمو)', i: '📚'},
                                {t: 'تطوير تشكيلة FC Mobile', i: '⚽'},
                                {t: 'كتابة خاطرة عميقة', i: '🖋️'}
                            ].map((h, i) => (
                                <div key={i} style={{display: 'flex', alignItems: 'center', gap: '15px', padding: '15px 0', borderBottom: i<2?'1px solid rgba(255,255,255,0.05)':'none'}}>
                                    <div className="btn-check"></div>
                                    <span style={{fontSize: '18px'}}>{h.i}</span>
                                    <span style={{fontSize: '15px', flex: 1}}>{h.t}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <footer style={{textAlign: 'center', marginTop: '50px', color: '#333', fontSize: '10px', letterSpacing: '4px'}}>
                        HADI HARFOUSH | THE MASTERMIND
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
