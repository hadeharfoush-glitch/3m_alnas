<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HADI OS v14</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  --gold:#D4AF37;
  --bg:#000;
  --glass:rgba(255,255,255,0.04);
  --soft:rgba(212,175,55,0.15);
}

/* iOS SYSTEM FONT (خفيف + متوافق شاومي) */
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overflow-x:hidden;
}

/* container */
.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

/* glass (خفيف للموبايل الضعيف) */
.card{
  background:var(--glass);
  border:1px solid var(--soft);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;

  /* IMPORTANT: خففنا blur لتفادي تهنيج شاومي */
  backdrop-filter: blur(10px);

  box-shadow:0 6px 25px rgba(0,0,0,0.6);

  /* animation خفيف */
  transition:transform .2s ease, opacity .2s ease;
}

/* click feel */
.card:active{
  transform:scale(0.98);
}

/* clock */
.clock{
  font-size:50px;
  text-align:center;
  color:var(--gold);
  font-weight:200;
  margin:18px 0;
  letter-spacing:-1px;
}

/* days */
.days{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
}

.day{
  text-align:center;
  font-size:10px;
  opacity:0.7;
}

.circle{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:5px;
  transition:.2s;
}

.active .circle{
  border-color:var(--gold);
  background:rgba(212,175,55,0.12);
}

/* task */
.task{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
  transition:.2s;
}

.task:active{
  transform:scale(0.98);
}

/* check */
.check{
  width:18px;
  height:18px;
  border:1px solid var(--gold);
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* title */
.period{
  font-size:10px;
  color:var(--gold);
  letter-spacing:2px;
  margin-bottom:10px;
  opacity:0.8;
}

/* glow text */
.glow{
  text-align:center;
  font-size:12px;
  color:var(--gold);
  opacity:0.7;
}

/* subtle fade in */
.fade{
  animation:fadeIn .4s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(5px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useMemo} = React;

/* 🔊 lightweight sound (works on Xiaomi) */
const clickSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3");
clickSound.volume = 0.35;

/* schedule */
const SCHEDULE={
  "الصباح":[
    {id:"m1",t:"استيقاظ + ترتيب يومك"},
    {id:"m2",t:"تمارين خفيفة"},
    {id:"m3",t:"قراءة 15 دقيقة"}
  ],
  "التركيز":[
    {id:"p1",t:"دراسة"},
    {id:"p2",t:"إنجليزي"},
    {id:"p3",t:"مهارة عمل"}
  ],
  "المساء":[
    {id:"e1",t:"نادي / حركة"},
    {id:"e2",t:"شغل أو تعلم"},
    {id:"e3",t:"تخطيط بكرا"}
  ]
};

function App(){

const [time,setTime]=useState(new Date());
const [done,setDone]=useState(()=>{
  return JSON.parse(localStorage.getItem("done")||"{}");
});

useEffect(()=>{
  const i=setInterval(()=>setTime(new Date()),1000);
  return ()=>clearInterval(i);
},[]);

useEffect(()=>{
  localStorage.setItem("done",JSON.stringify(done));
},[done]);

const toggle=(id)=>{
  try{ clickSound.play(); }catch(e){}
  setDone(p=>({...p,[id]:!p[id]}));
};

const progress=useMemo(()=>{
  const all=Object.values(SCHEDULE).flat().length;
  const ok=Object.values(done).filter(Boolean).length;
  return Math.round((ok/all)*100);
},[done]);

const days=["أحد","إثن","ثلاث","أربع","خميس","جمعة","سبت"];

return(
<div className="container fade">

{/* days */}
<div className="days">
{days.map((d,i)=>(
<div key={i} className={`day ${time.getDay()===i?'active':''}`}>
{time.getDay()===i && <div style={{color:"#D4AF37"}}>{progress}%</div>}
<div className="circle">{d}</div>
</div>
))}
</div>

{/* clock */}
<div className="clock">
{time.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
</div>

<div className="glow">HADI SYSTEM • FOCUS MODE</div>

{/* progress */}
<div className="card">
التقدم اليوم: {progress}%
</div>

{/* tasks */}
{Object.entries(SCHEDULE).map(([p,arr])=>(
<div className="card" key={p}>

<div className="period">{p}</div>

{arr.map(x=>(
<div key={x.id}
className="task"
onClick={()=>toggle(x.id)}
style={{opacity:done[x.id]?0.4:1}}>

<div className="check">
{done[x.id] && "✓"}
</div>

<div style={{flex:1,marginRight:10}}>
{x.t}
</div>

</div>
))}

</div>
))}

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
