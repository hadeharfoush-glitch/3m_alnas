<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HADI OS v15</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  --gold:#D4AF37;
  --bg:#000;
  --soft:rgba(212,175,55,0.15);
  --glass:rgba(255,255,255,0.04);
}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

/* XP BAR */
.xpBar{
  height:8px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0 20px;
}

.xpFill{
  height:100%;
  background:var(--gold);
  transition:0.3s;
}

/* cards */
.card{
  background:var(--glass);
  border:1px solid var(--soft);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  backdrop-filter: blur(10px);
  transition:0.2s;
}

.card:active{
  transform:scale(0.98);
}

/* header stats */
.stats{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:12px;
  opacity:0.8;
}

/* task */
.task{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}

/* check */
.check{
  width:18px;height:18px;
  border:1px solid var(--gold);
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* level badge */
.level{
  text-align:center;
  color:var(--gold);
  font-size:20px;
  margin:10px 0;
}

/* streak */
.streak{
  text-align:center;
  font-size:12px;
  opacity:0.8;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useMemo} = React;

const clickSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3");
clickSound.volume = 0.3;

const TASKS = [
  {id:"t1",text:"تمارين"},
  {id:"t2",text:"دراسة"},
  {id:"t3",text:"إنجليزي"},
  {id:"t4",text:"شغل / تطوير"},
  {id:"t5",text:"قراءة"}
];

function App(){

const [done,setDone]=useState(()=>{
  return JSON.parse(localStorage.getItem("done")||"{}");
});

const [xp,setXp]=useState(()=>{
  return Number(localStorage.getItem("xp")||0);
});

const [streak,setStreak]=useState(()=>{
  return Number(localStorage.getItem("streak")||0);
});

const todayKey=new Date().toDateString();

/* reset daily tasks */
useEffect(()=>{
  const last=localStorage.getItem("lastDay");

  if(last!==todayKey){
    setDone({});
    setStreak(s=>s+1);
    localStorage.setItem("lastDay",todayKey);
  }
},[]);

/* save */
useEffect(()=>{
  localStorage.setItem("done",JSON.stringify(done));
  localStorage.setItem("xp",xp);
  localStorage.setItem("streak",streak);
},[done,xp,streak]);

/* level system */
const level=Math.floor(xp/100)+1;
const progress=xp%100;

const toggle=(id)=>{

clickSound.play().catch(()=>{});

/* haptic feedback (Xiaomi compatible) */
if(navigator.vibrate) navigator.vibrate(40);

setDone(prev=>{
  const newState={...prev,[id]:!prev[id]};

  if(!prev[id]){
    setXp(x=>x+20); // reward XP
  }else{
    setXp(x=>Math.max(0,x-20));
  }

  return newState;
});

};

const completed=Object.values(done).filter(Boolean).length;

return(
<div className="container">

{/* LEVEL */}
<div className="card">
<div className="level">LEVEL {level}</div>

<div className="streak">
🔥 Streak: {streak} days
</div>

<div className="stats">
<span>XP: {xp}</span>
<span>{completed}/{TASKS.length}</span>
</div>

<div className="xpBar">
<div className="xpFill" style={{width:progress+"%"}}></div>
</div>

</div>

{/* tasks */}
<div className="card">
{TASKS.map(t=>(
<div key={t.id}
className="task"
onClick={()=>toggle(t.id)}
style={{opacity:done[t.id]?0.4:1}}>

<div className="check">
{done[t.id] && "✓"}
</div>

<div style={{flex:1,marginRight:10}}>
{t.text}
</div>

</div>
))}
</div>

{/* motivation */}
<div className="card" style={{textAlign:"center",color:"#D4AF37"}}>
"كل مهمة = نسخة أقوى منك"
</div>

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
