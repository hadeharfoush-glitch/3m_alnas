<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadi Elite System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000000 !important; /* ضمان السواد التام */
            background-image: radial-gradient(circle at top right, #1a1608 0%, #000 70%) !important;
            color: #ffffff;
            font-family: 'Alexandria', -apple-system, sans-serif;
            direction: rtl;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .gold-text { color: #D4AF37; }
        .clock { font-size: 50px; text-align: center; margin: 20px 0; font-weight: 200; color: #D4AF37; }
        .task-item {
            display: flex; align-items: center; gap: 12px;
            padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .checkbox {
            width: 20px; height: 20px; border: 1px solid #D4AF37; border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [time, setTime] = useState(new Date());
            const [checked, setChecked] = useState({});

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const tasks = [
                { id: 1, text: "ورد الحفظ الديني", icon: "📖" },
                { id: 2, text: "تكتيكات FC Mobile", icon: "⚽" },
                { id: 3, text: "دراسة الكوبي رايتينج", icon: "✍️" },
                { id: 4, text: "منهاج الحادي عشر", icon: "📚" },
                { id: 5, text: "لغة إنجليزية (Smart)", icon: "🌐" }
            ];

            return (
                <div style={{ padding: '20px', maxWidth: '500px', margin: '0 auto' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#888' }}>
                        <span>إصدار النخبة V9.1</span>
                        <span>{time.toLocaleDateString('ar-SY')}</span>
                    </div>

                    <div className="clock">
                        {time.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' })}
                    </div>

                    <div className="glass-card" style={{ borderRight: '4px solid #D4AF37' }}>
                        <div style={{ fontSize: '10px', color: '#D4AF37' }}>خاطرة اليوم</div>
                        <div style={{ marginTop: '5px', fontStyle: 'italic' }}>"خُلقنا لـ نَترك أثراً"</div>
                    </div>

                    <div className="glass-card" style={{ padding: '10px 0' }}>
                        {tasks.map(task => (
                            <div key={task.id} className="task-item" onClick={() => setChecked({...checked, [task.id]: !checked[task.id]})}>
                                <div className="checkbox" style={{ background: checked[task.id] ? '#D4AF37' : 'transparent' }}></div>
                                <span style={{ fontSize: '18px' }}>{task.icon}</span>
                                <span style={{ flex: 1, opacity: checked[task.id] ? 0.3 : 1 }}>{task.text}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
