<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HADI OS v18</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  --gold:#D4AF37;
  --bg:#000;
  --soft:rgba(212,175,55,0.12);
  --glass:rgba(255,255,255,0.03);
}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

/* HERO */
.hero{
  background:linear-gradient(145deg,rgba(212,175,55,0.08),rgba(255,255,255,0.02));
  border:1px solid var(--soft);
  border-radius:22px;
  padding:18px;
  text-align:center;
  margin-bottom:12px;
}

.level{
  font-size:26px;
  color:var(--gold);
  font-weight:200;
}

.small{
  font-size:12px;
  opacity:0.7;
}

/* XP BAR */
.bar{
  height:8px;
  background:#111;
  border-radius:20px;
  margin-top:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:var(--gold);
  transition:0.3s;
}

/* CARD */
.card{
  background:var(--glass);
  border:1px solid var(--soft);
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
}

/* TASK */
.task{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}

/* CHECK */
.check{
  width:18px;height:18px;
  border:1px solid var(--gold);
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* warning */
.warn{
  color:#ff4d4d;
  font-size:12px;
  text-align:center;
  margin-top:8px;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useMemo} = React;

const click = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3");
click.volume = 0.3;

const TASKS=[
 {id:"1",t:"تمارين"},
 {id:"2",t:"دراسة"},
 {id:"3",t:"إنجليزي"},
 {id:"4",t:"مهارة"},
 {id:"5",t:"قراءة"}
];

function App(){

const [done,setDone]=useState(()=>{
 return JSON.parse(localStorage.getItem("done")||"{}");
});

const [xp,setXp]=useState(Number(localStorage.getItem("xp")||50));
const [streak,setStreak]=useState(Number(localStorage.getItem("streak")||0));
const [last,setLast]=useState(localStorage.getItem("last")||"");

const today=new Date().toDateString();

/* 🔥 REAL SYSTEM ENGINE */
useEffect(()=>{

// إذا يوم جديد وما اشتغلت → عقوبة بسيطة
if(last && last!==today){
  const completed=Object.values(done).filter(Boolean).length;

  if(completed===0){
    setXp(x=>Math.max(0,x-20)); // lose XP
    setStreak(0); // reset streak
  }else{
    setStreak(s=>s+1);
  }

  setDone({});
}

localStorage.setItem("last",today);

},[]);

useEffect(()=>{
localStorage.setItem("done",JSON.stringify(done));
localStorage.setItem("xp",xp);
localStorage.setItem("streak",streak);
},[done,xp,streak]);

/* LEVEL SYSTEM */
const level=Math.floor(xp/120)+1;
const progress=xp%120;

/* LOGIC IMPACT */
const toggle=(id)=>{

click.play().catch(()=>{});

if(navigator.vibrate) navigator.vibrate(40);

setDone(prev=>{
const newState={...prev,[id]:!prev[id]};

const completed=Object.values(newState).filter(Boolean).length;

/* 🎯 REWARD SYSTEM */
if(!prev[id]){
  setXp(x=>x+20);

  // bonus if consistency
  if(completed===TASKS.length){
    setXp(x=>x+30);
  }
}else{
  setXp(x=>Math.max(0,x-15)); // penalty if uncheck
}

return newState;
});

};

const completed=Object.values(done).filter(Boolean).length;

/* SYSTEM STATUS */
const warning = completed===0 ? "⚠️ ما عم تعمل شي اليوم → النظام عم يخسرك نقاط" : "";

return(
<div className="container">

{/* HERO */}
<div className="hero">

<div className="level">LEVEL {level}</div>
<div className="small">XP: {xp} • 🔥 Streak: {streak}</div>

<div className="bar">
<div className="fill" style={{width:progress+"%"}}></div>
</div>

</div>

{/* TASKS */}
<div className="card">
{TASKS.map(t=>(
<div key={t.id}
className="task"
onClick={()=>toggle(t.id)}
style={{opacity:done[t.id]?0.4:1}}>

<div className="check">
{done[t.id] && "✓"}
</div>

<div style={{flex:1,marginRight:10}}>
{t.t}
</div>

</div>
))}
</div>

{/* SYSTEM FEEDBACK */}
<div className="card" style={{textAlign:"center"}}>
{completed}/{TASKS.length} مهام اليوم
</div>

{warning && <div className="warn">{warning}</div>}

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
