<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadi | The Elite System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --bg: #000000;
            --glass: rgba(255, 255, 255, 0.03);
            --font-hadi: 'Alexandria', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #151208 0%, #000000 70%);
            color: #fff;
            font-family: var(--font-hadi);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            user-select: none;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .gold-border-active {
            border: 1px solid var(--gold) !important;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .clock-text {
            font-size: 42px;
            font-weight: 200;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-action {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 14px;
            font-family: var(--font-hadi);
            font-weight: 400;
            cursor: pointer;
            width: 100%;
        }

        .task-item {
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const QUOTES = [
            "الصمت هو أعلى مستويات الكاريزما.",
            "خُلقنا لنترك أثراً، لا لنكون مجرد أرقام.",
            "التميز يبدأ عندما ينتهي الجميع.",
            "عِش في الظل، واصنع ضجيجك بالنتائج.",
            "الغموض هو رداء الأقوياء.",
            "تعلقتُ بشمسٍ؛ كانت لغيري مطلعاً، ولي مغيباً."
        ];

        const TASKS = [
            { id: 't1', label: 'كورس الكوبي رايتينج', icon: '✍️' },
            { id: 't2', label: 'إدارة قنوات اليوتيوب', icon: '🎬' },
            { id: 't3', label: 'تجهيز باقات مستقل', icon: '💼' },
            { id: 't4', label: 'تطوير اللغة الإنجليزية', icon: '🌐' }
        ];

        function App() {
            const [time, setTime] = useState(new Date());
            const [checked, setChecked] = useState({});
            const [score, setScore] = useState(0);
            const [timer, setTimer] = useState(2700); // 45m
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            
            // Audio Effects
            const clickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-50.mp3');
            const doneSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');

            useEffect(() => {
                const timerId = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timerId);
            }, []);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timer > 0) {
                    interval = setInterval(() => setTimer(t => t - 1), 1000);
                } else if (timer === 0) {
                    setIsTimerRunning(false);
                    setScore(s => s + 100);
                    doneSound.play();
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timer]);

            const handleToggle = (id) => {
                clickSound.play();
                const newChecked = { ...checked, [id]: !checked[id] };
                setChecked(newChecked);
                if (newChecked[id]) setScore(s => s + 20);
            };

            const formatTime = (t) => {
                const m = Math.floor(t / 60);
                const s = t % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            return (
                <div style={{ padding: '40px 25px', maxWidth: '450px', margin: '0 auto' }}>
                    
                    {/* Live Clock Section */}
                    <div style={{ textAlign: 'center', marginBottom: '50px' }}>
                        <div className="clock-text">
                            {time.toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit' })}
                        </div>
                        <p style={{ color: 'var(--gold)', fontSize: '12px', letterSpacing: '2px', marginTop: '10px' }}>
                            {QUOTES[time.getSeconds() % QUOTES.length]}
                        </p>
                    </div>

                    {/* Stats Dashboard */}
                    <div className="glass-panel" style={{ padding: '20px', marginBottom: '30px', display: 'flex', justifyContent: 'space-between' }}>
                        <div>
                            <div style={{ fontSize: '10px', color: '#888' }}>مستوى النخبة</div>
                            <div style={{ fontSize: '18px', fontWeight: '700', color: 'var(--gold)' }}>{score} XP</div>
                        </div>
                        <div style={{ textAlign: 'left' }}>
                            <div style={{ fontSize: '10px', color: '#888' }}>التاريخ</div>
                            <div style={{ fontSize: '14px' }}>{time.toLocaleDateString('ar-SY')}</div>
                        </div>
                    </div>

                    {/* Deep Focus Timer */}
                    <div className={`glass-panel ${isTimerRunning ? 'gold-border-active' : ''}`} style={{ padding: '30px', textAlign: 'center', marginBottom: '30px' }}>
                        <div style={{ fontSize: '11px', color: '#888', marginBottom: '10px' }}>جلسة العمل العميق</div>
                        <div style={{ fontSize: '40px', fontWeight: '200', marginBottom: '20px' }}>{formatTime(timer)}</div>
                        <button className="btn-action" onClick={() => { clickSound.play(); setIsTimerRunning(!isTimerRunning); }}>
                            {isTimerRunning ? 'تعليق الجلسة' : 'بدء الانغماس'}
                        </button>
                    </div>

                    {/* Tasks */}
                    <div style={{ marginBottom: '40px' }}>
                        <h3 style={{ fontSize: '14px', fontWeight: '400', color: '#888', marginBottom: '20px' }}>المهمات الاستراتيجية</h3>
                        {TASKS.map(task => (
                            <div key={task.id} 
                                 onClick={() => handleToggle(task.id)}
                                 className={`glass-panel task-item ${checked[task.id] ? 'gold-border-active' : ''}`}
                                 style={{ opacity: checked[task.id] ? 0.4 : 1 }}>
                                <span style={{ fontSize: '20px' }}>{task.icon}</span>
                                <span style={{ fontSize: '14px', flex: 1 }}>{task.label}</span>
                                {checked[task.id] && <span style={{ color: 'var(--gold)' }}>✓</span>}
                            </div>
                        ))}
                    </div>

                    <footer style={{ textAlign: 'center', color: '#444', fontSize: '10px', letterSpacing: '3px' }}>
                        BY HADI HARFOUSH | ELITE EDITION
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
