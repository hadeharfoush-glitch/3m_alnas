<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HADI OS v16</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  --gold:#D4AF37;
  --bg:#000;
  --soft:rgba(212,175,55,0.12);
  --glass:rgba(255,255,255,0.03);
}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

/* layout */
.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

/* HERO DASHBOARD */
.hero{
  background:linear-gradient(145deg,rgba(212,175,55,0.08),rgba(255,255,255,0.02));
  border:1px solid var(--soft);
  border-radius:24px;
  padding:20px;
  margin-bottom:15px;
  text-align:center;
  backdrop-filter: blur(10px);
}

.level{
  font-size:26px;
  color:var(--gold);
  font-weight:200;
}

.sub{
  font-size:12px;
  opacity:0.7;
}

/* XP BAR */
.bar{
  height:8px;
  background:#111;
  border-radius:20px;
  margin-top:12px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:var(--gold);
  transition:0.3s;
}

/* cards */
.card{
  background:var(--glass);
  border:1px solid var(--soft);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  transition:0.2s;
}

.card:active{
  transform:scale(0.98);
}

/* task */
.task{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}

/* check */
.check{
  width:18px;
  height:18px;
  border:1px solid var(--gold);
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* stats row */
.row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  opacity:0.8;
}

/* streak badge */
.streak{
  text-align:center;
  color:var(--gold);
  font-size:12px;
  margin-top:8px;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useMemo} = React;

const clickSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3");
clickSound.volume = 0.3;

const TASKS=[
  {id:"1",t:"تمارين جسم"},
  {id:"2",t:"دراسة"},
  {id:"3",t:"إنجليزي"},
  {id:"4",t:"شغل / مهارة"},
  {id:"5",t:"قراءة / تطوير"}
];

function App(){

const [done,setDone]=useState(()=>{
  return JSON.parse(localStorage.getItem("done")||"{}");
});

const [xp,setXp]=useState(Number(localStorage.getItem("xp")||0));
const [streak,setStreak]=useState(Number(localStorage.getItem("streak")||0));

const today=new Date().toDateString();

/* daily reset */
useEffect(()=>{
  const last=localStorage.getItem("last");
  if(last!==today){
    setDone({});
    setStreak(s=>s+1);
    localStorage.setItem("last",today);
  }
},[]);

useEffect(()=>{
  localStorage.setItem("done",JSON.stringify(done));
  localStorage.setItem("xp",xp);
  localStorage.setItem("streak",streak);
},[done,xp,streak]);

const level=Math.floor(xp/120)+1;
const progress=xp%120;

const toggle=(id)=>{

clickSound.play().catch(()=>{});

if(navigator.vibrate) navigator.vibrate(40);

setDone(prev=>{
  const isNew=!prev[id];

  if(isNew) setXp(x=>x+25);
  else setXp(x=>Math.max(0,x-25));

  return {...prev,[id]:!prev[id]};
});

};

const completed=Object.values(done).filter(Boolean).length;

return(
<div className="container">

{/* HERO */}
<div className="hero">
  <div className="level">LEVEL {level}</div>
  <div className="sub">BEAST MODE SYSTEM</div>

  <div className="bar">
    <div className="fill" style={{width:progress+"%"}}></div>
  </div>

  <div className="row" style={{marginTop:10}}>
    <span>XP: {xp}</span>
    <span>{completed}/{TASKS.length}</span>
  </div>

  <div className="streak">🔥 Streak: {streak} days</div>
</div>

{/* TASKS */}
<div className="card">
{TASKS.map(t=>(
<div key={t.id}
className="task"
onClick={()=>toggle(t.id)}
style={{opacity:done[t.id]?0.4:1}}>

<div className="check">
{done[t.id] && "✓"}
</div>

<div style={{flex:1,marginRight:10}}>
{t.t}
</div>

</div>
))}
</div>

{/* QUOTE */}
<div className="card" style={{textAlign:"center",color:"#D4AF37"}}>
"Discipline is the real luxury."
</div>

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
