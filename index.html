<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadi | Mastery System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Alexandria', sans-serif; }
        .main-container { padding: 30px 20px; max-width: 480px; margin: 0 auto; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .streak-val { font-size: 32px; font-weight: 700; color: var(--gold); }
        .copy-pill { font-size: 13px; color: #ccc; border-right: 2px solid var(--gold); padding-right: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [streak, setStreak] = useState(12); // مثال للـ Streak الحالي
            const [copyTip, setCopyTip] = useState("معادلة PAS: Problem (مشكلة) -> Agitation (تضخيم) -> Solution (حل).");

            return (
                <div className="main-container">
                    {/* نظام الاستمرارية */}
                    <div className="glass-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div>
                            <div style={{ fontSize: '10px', color: '#888' }}>نظام الاستمرارية</div>
                            <div className="streak-val">{streak} <span style={{fontSize: '16px', color: '#fff'}}>يوم انضباط</span></div>
                        </div>
                        <div style={{ width: '50px', height: '50px', borderRadius: '50%', border: '2px solid var(--gold)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            {Math.round((streak / 90) * 100)}%
                        </div>
                    </div>

                    {/* قاموس الكوبي رايتينج */}
                    <div className="glass-card">
                        <div style={{ fontSize: '10px', color: var(--gold), letterSpacing: '2px' }}>نصيحة الكوبي رايتينج اليومية</div>
                        <div className="copy-pill">{copyTip}</div>
                    </div>

                    {/* تذكير FC Mobile */}
                    <div className="glass-card" style={{ border: 'none', background: 'linear-gradient(45deg, #1a1608, #000)' }}>
                        <div style={{ fontSize: '10px', color: '#D4AF37' }}>تكتيك الـ 122 OVR</div>
                        <div style={{ fontSize: '14px', marginTop: '5px' }}>جرب التشكيلة الدفاعية المتوازنة (4-3-3 Holding) لضمان السيطرة في نمط المدير الفني.</div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
