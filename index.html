<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadi | The System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(25, 25, 35, 0.6);
            --accent: #4a6fa5;
            --success: #7ec8a0;
            --text-main: #e8e4d9;
            --text-dim: #888;
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        }
        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1a1a2e 0%, #050505 50%);
            color: var(--text-main);
            font-family: 'IBM Plex Sans Arabic', var(--ios-font);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }
        .task-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }
        .task-card:active { transform: scale(0.97); }
        .progress-bar-inner {
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const QUOTES = [
            "خُـلـقـنـا لـ نَـتـرك أثـراً.",
            "تعلقتُ بشمسٍ؛ كانت لغيري مطلعاً، ولي مغيباً.",
            "العمق ليس في الكلمات، بل في الأثر الذي تتركه.",
            "الانضباط هو الجسر بين الأهداف والإنجاز.",
            "أنت سيد قرارك، ومستقبلك يبدأ من روتينك الآن."
        ];
        const ROUTINE = [
            { id: 'morning', title: "بداية الأثر", time: "07:30", tasks: [
                { id: "water", label: "ارتواء (ماء)", icon: "💧" },
                { id: "hifz", label: "الحفظ الديني", icon: "📖" },
                { id: "breakfast", label: "تغذية", icon: "🍳" },
                { id: "fifa", label: "مكافأة فيفا", icon: "🎮" }
            ]},
            { id: 'focus', title: "ساعات العمل", time: "10:00", tasks: [
                { id: "work", label: "فريلانس / كوبي رايتينج", icon: "💼" },
                { id: "youtube", label: "إدارة القنوات / مستقل", icon: "🎬" },
                { id: "exercise", label: "تفريغ طاقة (رياضة)", icon: "⚽" }
            ]},
            { id: 'night', title: "مراجعة الصمت", time: "21:00", tasks: [
                { id: "journal", label: "خاطرة اليوم", icon: "✍️" },
                { id: "priority", label: "هدف الغد الوحيد", icon: "🎯" },
                { id: "read", label: "قراءة عميقة", icon: "📚" },
                { id: "off", label: "الهروب من الشاشة (📵)", icon: "📵" }
            ]}
        ];
        function App() {
            const [checked, setChecked] = useState({});
            const [streak, setStreak] = useState(0);
            const [quote] = useState(QUOTES[Math.floor(Math.random() * QUOTES.length)]);
            useEffect(() => {
                const saved = localStorage.getItem('hadi-pro-v2');
                if (saved) setChecked(JSON.parse(saved));
                setStreak(Number(localStorage.getItem('hadi-streak')) || 0);
            }, []);
            const toggle = (id) => {
                const updated = { ...checked, [id]: !checked[id] };
                setChecked(updated);
                localStorage.setItem('hadi-pro-v2', JSON.stringify(updated));
                const totalTasks = ROUTINE.flatMap(r => r.tasks).length;
                const doneCount = Object.values(updated).filter(Boolean).length;
                if (doneCount === totalTasks) {
                   const newStreak = streak + 1;
                   setStreak(newStreak);
                   localStorage.setItem('hadi-streak', newStreak);
                }
            };
            const totalTasks = ROUTINE.flatMap(r => r.tasks).length;
            const doneCount = Object.values(checked).filter(Boolean).length;
            const progress = Math.round((doneCount / totalTasks) * 100);
            const getLevel = () => {
                if (streak < 5) return "مبتدئ طموح";
                if (streak < 15) return "ملتزم محترف";
                return "سيد الانضباط";
            };
            return (
                <div style={{ padding: '30px 20px', maxWidth: '500px', margin: '0 auto', animation: 'fadeIn 0.8s ease-out' }}>
                    <header style={{ marginBottom: '40px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                            <h1 style={{ fontSize: '26px', fontWeight: '700', letterSpacing: '-1px' }}>طابت أيامك يا هادي</h1>
                            <div className="glass" style={{ padding: '5px 15px', fontSize: '12px', color: '#7ec8a0' }}>{getLevel()}</div>
                        </div>
                        <p style={{ color: '#888', fontSize: '14px', fontStyle: 'italic' }}>"{quote}"</p>
                    </header>
                    <div className="glass" style={{ padding: '20px', marginBottom: '35px', textAlign: 'center' }}>
                        <div style={{ fontSize: '12px', color: '#888', marginBottom: '8px', textTransform: 'uppercase' }}>تقدم اليوم</div>
                        <div style={{ fontSize: '32px', fontWeight: '700', marginBottom: '15px' }}>{progress}%</div>
                        <div style={{ height: '6px', background: 'rgba(255,255,255,0.05)', borderRadius: '10px', overflow: 'hidden' }}>
                            <div className="progress-bar-inner" style={{ width: `${progress}%`, height: '100%', background: 'linear-gradient(90deg, #4a6fa5, #7ec8a0)' }}></div>
                        </div>
                        <div style={{ marginTop: '15px', fontSize: '13px' }}>🔥 ستريك الانضباط: <span style={{ color: '#7ec8a0', fontWeight: 'bold' }}>{streak} أيام</span></div>
                    </div>
                    {ROUTINE.map((block) => (
                        <div key={block.id} style={{ marginBottom: '35px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '15px' }}>
                                <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#4a6fa5' }}></div>
                                <h2 style={{ fontSize: '16px', fontWeight: '600', margin: 0 }}>{block.title}</h2>
                                <span style={{ fontSize: '12px', color: '#888' }}>{block.time}</span>
                            </div>
                            {block.tasks.map(task => (
                                <div key={task.id} 
                                     onClick={() => toggle(task.id)}
                                     className="glass task-card" 
                                     style={{ 
                                        padding: '18px', 
                                        marginBottom: '12px', 
                                        display: 'flex', 
                                        alignItems: 'center', 
                                        gap: '15px',
                                        opacity: checked[task.id] ? 0.6 : 1,
                                        borderRight: checked[task.id] ? `4px solid #7ec8a0` : '1px solid rgba(255,255,255,0.05)'
                                     }}>
                                    <div style={{ 
                                        width: '24px', height: '24px', borderRadius: '50%', 
                                        border: '2px solid rgba(255,255,255,0.1)',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                        background: checked[task.id] ? '#7ec8a0' : 'transparent'
                                    }}>
                                        {checked[task.id] && <span style={{ color: '#000', fontSize: '14px', fontWeight: 'bold' }}>✓</span>}
                                    </div>
                                    <span style={{ fontSize: '20px' }}>{task.icon}</span>
                                    <span style={{ fontSize: '15px', textDecoration: checked[task.id] ? 'line-through' : 'none' }}>{task.label}</span>
                                </div>
                            ))}
                        </div>
                    ))}
                    <footer style={{ textAlign: 'center', marginTop: '50px', color: '#888', fontSize: '11px' }}>
                        نظام الانضباط الشخصي - نسخة هادي حرفوش
                    </footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
