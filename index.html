<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadi | The Architect V10</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C5A059; --bg: #050505; --glass: rgba(255, 255, 255, 0.03); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Alexandria', sans-serif; background-image: radial-gradient(circle at 50% 0%, #1a1508 0%, #050505 80%); }
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(197, 160, 89, 0.1); border-radius: 25px; padding: 20px; margin-bottom: 20px; }
        .clock-v10 { font-size: 55px; font-weight: 200; text-align: center; color: var(--gold); margin: 20px 0; }
        .day-box { width: 45px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; }
        .score-circle { width: 35px; height: 35px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 9px; }
        .day-active .score-circle { border-color: var(--gold); background: rgba(197, 160, 89, 0.1); color: var(--gold); }
        .time-tag { font-size: 10px; color: var(--gold); letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .task-row { padding: 12px 0; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .check-v10 { width: 18px; height: 18px; border: 1.2px solid var(--gold); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .btn-main { background: var(--gold); border: none; color: #000; padding: 15px; border-radius: 15px; width: 100%; font-weight: 700; cursor: pointer; }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const INTEL = [
            { t: "English Word", v: "Pragmatic (واقعي/عملي) - Use it in business pitches." },
            { t: "Copywriting", v: "Focus on the 'Transformation', not just the product features." },
            { t: "Mindset", v: "Consistency beats intensity every single time." },
            { t: "English Word", v: "Sophisticated (راقي/متطور) - To describe high-end brands." }
        ];

        const ROUTINE = {
            morning: [
                { id: "m1", label: "استيقاظ مبكر + ورد ديني", i: "☀️" },
                { id: "m2", label: "تمارين رياضية (High Intensity)", i: "🏃‍♂️" }
            ],
            deep_work: [
                { id: "d1", label: "دراسة منهج الحادي عشر", i: "📚" },
                { id: "d2", label: "كورس الكوبي رايتينج", i: "🖋️" },
                { id: "d3", label: "تطوير اللغة الإنجليزية", i: "🌐" }
            ],
            evening: [
                { id: "e1", label: "تكتيكات FC Mobile (Target 122)", i: "⚽" },
                { id: "e2", label: "تقديم باقات عمل (Mustaqil)", i: "🎯" },
                { id: "e3", label: "قراءة ليلية عميقة", i: "📖" }
            ]
        };

        function App() {
            const [time, setTime] = useState(new Date());
            const [checked, setChecked] = useState({});
            const [dailyScores, setDailyScores] = useState([85, 90, 75, 0, 0, 0, 0]); // مثال لعلامات الأسبوع

            useEffect(() => {
                const clock = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(clock);
            }, []);

            const toggleTask = (id) => {
                setChecked(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const totalTasks = Object.values(ROUTINE).flat().length;
            const completedCount = Object.values(checked).filter(Boolean).length;
            const currentPercentage = Math.round((completedCount / totalTasks) * 100);

            const dailyIntel = INTEL[time.getDate() % INTEL.length];

            return (
                <div style={{ padding: '30px 20px', maxWidth: '480px', margin: '0 auto' }}>
                    
                    {/* Calendar with Scores */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '30px' }}>
                        {["أحد", "إثن", "ثلاث", "أربع", "خميس", "جمعة", "سبت"].map((d, i) => (
                            <div key={i} className={`day-box ${time.getDay() === i ? 'day-active' : ''}`}>
                                <span>{d}</span>
                                <div className="score-circle">
                                    {time.getDay() === i ? currentPercentage : dailyScores[i]}%
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="clock-v10">{time.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' })}</div>

                    {/* Daily Intel Card */}
                    <div className="glass-card" style={{ borderRight: '4px solid var(--gold)' }}>
                        <span className="time-tag">{dailyIntel.t}</span>
                        <div style={{ fontSize: '14px', fontStyle: 'italic', color: '#ccc' }}>"{dailyIntel.v}"</div>
                    </div>

                    {/* Organized Habits */}
                    {Object.entries(ROUTINE).map(([period, tasks]) => (
                        <div key={period} className="glass-card">
                            <span className="time-tag">{period.toUpperCase().replace('_', ' ')}</span>
                            {tasks.map(task => (
                                <div key={task.id} className="task-row" onClick={() => toggleTask(task.id)} style={{ opacity: checked[task.id] ? 0.3 : 1 }}>
                                    <div className="check-v10" style={{ background: checked[task.id] ? 'var(--gold)' : 'transparent' }}>
                                        {checked[task.id] && <span style={{color: '#000', fontSize: '10px'}}>✓</span>}
                                    </div>
                                    <span style={{fontSize: '15px', flex: 1}}>{task.label}</span>
                                    <span>{task.i}</span>
                                </div>
                            ))}
                        </div>
                    ))}
                    
                    <footer style={{ textAlign: 'center', opacity: 0.2, fontSize: '9px', letterSpacing: '4px' }}>HADI HARFOUSH | STRATEGIC SYSTEM</footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
            </html>
